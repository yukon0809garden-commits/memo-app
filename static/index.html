<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メモアプリ</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1>メモアプリ</h1>
        <button type="button" id="btn-dark-mode" class="btn-secondary">🌙 ダークモード</button>
    </header>

    <main>
        <!-- メモ入力フォーム（新規作成専用） -->
        <section class="form-section">
            <h2>メモの作成</h2>
            <form id="memo-form">
                <div class="form-group">
                    <label for="memo-title">タイトル</label>
                    <input type="text" id="memo-title" placeholder="タイトルを入力" maxlength="100">
                    <span class="char-count" id="title-char-count">0 / 100</span>
                </div>
                <div class="form-group">
                    <label for="memo-body">本文</label>
                    <textarea id="memo-body" rows="5" placeholder="本文を入力" maxlength="2000"></textarea>
                    <span class="char-count" id="body-char-count">0 / 2000</span>
                </div>
                <div class="form-group">
                    <label for="memo-category">カテゴリ</label>
                    <input type="text" id="memo-category" placeholder="例: 仕事, 私生活, 買い物">
                </div>
                <div class="form-buttons">
                    <button type="submit" id="btn-create">作成</button>
                </div>
            </form>
        </section>

        <!-- メモの検索 -->
        <section class="search-section" style="margin-bottom: 20px; background: #f4f4f4; padding: 15px; border-radius: 5px;">
            <h2>メモの検索</h2>
            <input type="text" id="search-input" placeholder="キーワードで絞り込み...">
            <button type="button" id="btn-search">検索</button>
            <button type="button" id="btn-clear-search" class="btn-secondary">クリア</button>
        </section>

        <!-- ソート切り替え -->
        <section class="sort-section" style="margin-bottom: 20px;">
            <label for="sort-select">並び順:</label>
            <select id="sort-select">
                <option value="updated_at-desc">更新日時（新しい順）</option>
                <option value="updated_at-asc">更新日時（古い順）</option>
                <option value="created_at-desc">作成日時（新しい順）</option>
                <option value="created_at-asc">作成日時（古い順）</option>
            </select>
        </section>

        <!-- メモ一覧 -->
        <section class="list-section">
            <h2>メモ一覧</h2>
            <div id="memo-list">
                <p class="empty-message">メモがまだありません。上のフォームから作成してみましょう。</p>
            </div>
        </section>
    </main>

    <!-- 編集用モーダル -->
    <dialog id="edit-dialog">
        <form id="edit-form">
            <h2>メモの編集</h2>
            <input type="hidden" id="edit-memo-id">
            <div class="form-group">
                <label for="edit-memo-title">タイトル</label>
                <input type="text" id="edit-memo-title" maxlength="100">
                <span class="char-count" id="edit-title-char-count">0 / 100</span>
            </div>
            <div class="form-group">
                <label for="edit-memo-body">本文</label>
                <textarea id="edit-memo-body" rows="5" maxlength="2000"></textarea>
                <span class="char-count" id="edit-body-char-count">0 / 2000</span>
            </div>
            <div class="form-group">
                <label for="edit-memo-category">カテゴリ</label>
                <input type="text" id="edit-memo-category">
            </div>
            <div class="form-buttons">
                <button type="submit" id="btn-update">更新</button>
                <button type="button" id="btn-delete">削除</button>
                <button type="button" id="btn-cancel" class="btn-secondary">キャンセル</button>
            </div>
        </form>
    </dialog>

    <script src="/static/app.js"></script>
</body>
</html>
